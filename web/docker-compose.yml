services:
  jekyll:
    image: urykhy/jekyll
    build: jekyll
    container_name: jekyll
    networks:
      - web
    command: bash -c "bundler install && jekyll serve --trace --verbose --port 80 --host 0.0.0.0"
    volumes:
      - /home/ury/devel/jekyll/stuff:/srv/jekyll

  uwsgi-php:
    image: urykhy/uwsgi
    build: uwsgi
    container_name: uwsgi-php
    volumes:
      - /home/ury:/home/ury
    command: uwsgi php.ini
    networks:
      - web

  uwsgi-torrent:
    image: urykhy/uwsgi
    build:
      context: uwsgi
      args:
        APT_PROXY: ${APT_PROXY}
        PIP_INDEX_URL: ${PIP_INDEX_URL}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST}
    container_name: uwsgi-torrent
    volumes:
      - /home/ury:/home/ury
    command: uwsgi torrent.ini
    networks:
      - web
    environment:
      PYTHONUNBUFFERED: 1

  uwsgi-flibusta:
    image: urykhy/uwsgi
    build:
      context: uwsgi
      args:
        APT_PROXY: ${APT_PROXY}
        PIP_INDEX_URL: ${PIP_INDEX_URL}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST}
    container_name: uwsgi-flibusta
    volumes:
      - /home/ury:/home/ury
      - /u03/mirror/fb2.Flibusta.Net:/u03/mirror/fb2.Flibusta.Net
    command: uwsgi flibusta.ini
    networks:
      - web
    environment:
      PYTHONUNBUFFERED: 1
      MYSQL_PORT: 3306
      MYSQL_HOST: mysql-master.docker
      MYSQL_USER: user
      MYSQL_PASS: user

  nginx:
    image: nginx:1.31.6-alpine-otel
    hostname: nginx
    container_name: nginx
    network_mode: "host"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/nginx.js:/etc/nginx/nginx.js
      - /home/ury:/home/ury
      - /etc/ssl/elf:/etc/ssl/elf
      - nginx-cache:/cache
    depends_on:
      - jekyll
      - uwsgi-php
      - uwsgi-torrent
      - uwsgi-flibusta
    restart: unless-stopped

  goproxy:
    image: goproxy/goproxy:latest
    command: "-listen=0.0.0.0:8080 -cacheDir=/go -proxy=https://goproxy.io/"
    hostname: goproxy
    container_name: goproxy
    networks:
      - web
    volumes:
      - goproxy:/go

  registry:
    image: registry:2
    container_name: registry
    hostname: registry
    networks:
      - web
    volumes:
      - registry:/var/lib/registry
      - ./registry.yml:/etc/docker/registry/config.yml

  uptime:
    image: louislam/uptime-kuma:2
    hostname: uptime-kuma
    container_name: uptime-kuma
    networks:
      - web
    volumes:
      - uptime-kuma:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.uptime.rule=Host(`uptime`)
      - traefik.http.services.uptime.loadbalancer.server.port=3001
    environment:
      NOTIFICATION_PROXY: http://10.103.10.3:8090

  traefik:
    image: traefik:v3.6.10
    hostname: traefik
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.traefik.address=:81"
      - "--providers.docker.exposedByDefault=false"
    networks:
      - web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  authelia:
    image: "authelia/authelia:4.39"
    hostname: authelia
    domainname: elf.dark
    container_name: authelia
    networks:
      - web
    volumes:
      - "./authelia:/config"
    healthcheck:
      disable: true
    environment:
      TZ: "Europe/Moscow"
      PUID: "1000"
      GGID: "100"

networks:
  web:
    external: true

volumes:
  nginx-cache:
    external: true
  goproxy:
    external: true
  registry:
    external: true
  uptime-kuma:
    external: true
